<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="المقاولات"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#0a1e4a">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>نظام إدارة شركات المقاولات</title>
<style>
:root{--ink:#1f2a30;--steel:#3b5b6e;--sand:#efece6;--card:#fff;--line:#d9d5cc;--amber:#e0a100;--ok:#2f7d5b;--bad:#b23a2e;--mut:#6b7378}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(rgba(239,236,230,var(--ov,.8)),rgba(239,236,230,var(--ov,.8))),var(--bg) center/cover fixed var(--sand);color:var(--ink);display:flex;min-height:100vh}
nav{width:210px;background:var(--ink);color:#fff;padding:16px 0;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
nav h1{font-size:16px;margin:0 16px 14px;line-height:1.5}
nav button{display:block;width:100%;text-align:right;background:none;border:0;border-right:4px solid transparent;color:#cfd6da;padding:10px 16px;font:inherit;cursor:pointer}
nav button:hover{background:#2b3a42}
nav button.on{border-right-color:var(--amber);color:#fff;background:#2b3a42;font-weight:600}
nav .tools{margin-top:14px;border-top:1px solid #3a4a52;padding-top:8px}
main{flex:1;padding:22px;min-width:0}
h2{margin:0 0 16px;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.k{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px}
.k small{color:var(--mut);display:block;margin-bottom:6px}
.k b{font-size:21px}
.k.big{border-top:4px solid var(--amber)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;font:inherit;background:#fff}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--steel);outline-offset:1px}
.btn{background:var(--steel);color:#fff;border:0;border-radius:4px;padding:9px 16px;font:inherit;cursor:pointer}
.btn:hover{background:#2c475a}
.del{background:none;border:0;color:var(--bad);cursor:pointer;font:inherit}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f6f4ef;color:var(--mut);font-weight:600}
.bar{height:8px;background:#e4e0d7;border-radius:4px;min-width:90px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.tag{padding:2px 8px;border-radius:10px;background:#e4e0d7;font-size:12px}
.empty{color:var(--mut);padding:18px;text-align:center}
.tot{margin-top:10px;font-weight:600}
.note{font-size:12px;color:var(--mut);margin-top:10px}
@media(max-width:760px){body{display:block}nav{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:8px}nav h1,.tools{display:none}nav button{width:auto;white-space:nowrap;border-right:0;border-bottom:3px solid transparent}nav button.on{border-bottom-color:var(--amber)}main{padding:14px}}
@media print{nav,.panel.formp,.del{display:none}body{display:block;background:#fff}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.hero{height:150px;border-radius:6px;background:linear-gradient(transparent 25%,rgba(31,42,48,.8)),var(--bg) center/cover;margin-bottom:16px;display:flex;align-items:flex-end;padding:16px}body.lg{--ov:.1}

body{background:linear-gradient(rgba(238,242,248,.88),rgba(238,242,248,.88)),var(--bg) center/cover fixed #eef2f8}
body.lg{background:linear-gradient(rgba(10,30,74,.35),rgba(10,30,74,.35)),var(--bg) center/cover fixed #0a1e4a}
.hero{height:140px;padding:0;border-radius:10px;background:linear-gradient(90deg,rgba(8,26,63,.6),transparent 65%),var(--ph) var(--pp,center)/cover;align-items:flex-end;padding:14px 18px}
.hero.dh{height:auto;aspect-ratio:1340/137;background:var(--ph) center/100% 100%}
.btn{background:#1a73e8}.btn:hover{background:#1558b8}
th{background:#f1f5fb}.panel,.k{border-radius:10px;border-color:#e1e7f0}
.top{display:flex;align-items:center;gap:16px;background:#fff;margin:-22px -22px 16px;padding:10px 22px;border-bottom:1px solid #dfe5ef}
.top .co{font-weight:700;font-size:16px;color:#0a1e4a}
.sr{flex:1;max-width:460px;border-radius:20px;padding:9px 16px;background:#f4f7fb}
.bell{position:relative;background:none;border:0;font-size:20px;cursor:pointer}
.bell i{position:absolute;top:-6px;left:-8px;background:#e5484d;color:#fff;border-radius:9px;font-size:10px;padding:0 5px;font-style:normal}
.dt{font-size:12px;color:#5b6b85;line-height:1.5}.us{font-size:13px;font-weight:600;line-height:1.3}.us small{display:block;color:#8794aa;font-weight:400}
.kps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.kp{background:#fff;border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 4px rgba(20,40,90,.08)}
.ic{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.kp small{display:block;color:#5b6b85;font-size:12px}.kp strong{font-size:20px;display:block}.kp em{font-size:11px;color:#8794aa;font-style:normal}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-bottom:14px}
.pn{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(20,40,90,.08)}.pn h3{margin:0 0 10px;font-size:15px}
.al{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #edf0f6;cursor:pointer;font-size:14px}
.al span{color:#fff;border-radius:6px;padding:1px 10px;font-weight:700}
.pr{margin:11px 0;font-size:13px}.pr div.b{height:8px;background:#e6ebf3;border-radius:5px;overflow:hidden;margin-top:4px}.pr i{display:block;height:100%}
.donut{width:150px;height:150px;border-radius:50%;margin:6px auto 10px;display:grid;place-items:center}
.donut div{width:100px;height:100px;background:#fff;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.tile{background:#fff;border-radius:10px;padding:14px 8px;text-align:center;cursor:pointer;box-shadow:0 1px 4px rgba(20,40,90,.08);border:0;font:inherit}
.tile b{display:block;font-size:28px}.tile span{display:block;font-weight:700;margin:4px 0 2px}.tile small{color:#8794aa;font-size:11px}
.brand{display:flex;align-items:center;gap:10px;padding:0 16px 14px;font-weight:700;font-size:15px}.brand small{color:#8fa3c9;font-weight:400;font-size:11px}
@media(min-width:761px){nav{width:230px;background:linear-gradient(#0a1e4a,#0d2a63 65%,#081a3f)}nav button{width:calc(100% - 20px);margin:2px 10px;border:0;border-radius:8px;padding:10px 12px}nav button.on{background:#1a73e8;border:0}nav .tools{border-top:1px solid #23407f}nav .tools small{display:block;padding:6px 16px;color:#8fa3c9;font-size:12px}}
@media(max-width:760px){.top{margin:-14px -14px 12px;flex-wrap:wrap;padding:8px 14px}.dt,.brand{display:none}}
@media print{.top,.hero{display:none}}
#vw{position:fixed;inset:0;background:rgba(10,20,40,.82);z-index:9;overflow:auto;padding:20px}.vb{background:#fff;border-radius:10px;max-width:900px;margin:0 auto;padding:16px}.vh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.vi{margin:12px 0;border:1px solid #e1e7f0;border-radius:8px;padding:8px;text-align:center}.vi img{max-width:100%;border-radius:6px}.th{height:36px;width:36px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-left:6px}
html{-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button,.btn,select,input{touch-action:manipulation}
@media(hover:none){input,select,textarea{font-size:16px}nav button,.btn,.del{min-height:44px}.btn{padding:10px 18px}}
@media(max-width:760px){
nav{padding-top:calc(8px + env(safe-area-inset-top));position:sticky;top:0;z-index:5;background:#0a1e4a}
nav button{padding:10px 14px;margin:0 2px;border-radius:8px}
main{padding:12px;padding-right:calc(12px + env(safe-area-inset-right));padding-left:calc(12px + env(safe-area-inset-left))}
.top{margin:-12px -12px 12px}.hero,.hero.dh{height:100px;aspect-ratio:auto}.hero.dh{background-size:cover}.hero h2{font-size:18px!important}
.kps{grid-template-columns:repeat(2,1fr)}.kp{padding:10px}.kp strong{font-size:17px}.ic{width:38px;height:38px;font-size:18px}
.g4{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr 1fr}
.top .co{font-size:14px}.sr{order:5;flex-basis:100%;max-width:none}th,td{padding:8px;font-size:13px}#vw{padding:8px}}
@media(max-width:760px) and (orientation:landscape){.hero{display:none}}
.pf{max-width:190px;border-radius:20px;padding:8px 12px;background:#f4f7fb}.pt{display:none}@media print{.pt{display:block;font-size:20px;font-weight:700;margin-bottom:8px}}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="main"></main>
<script>
const P=['قيد التنفيذ','متوقف','مكتمل'];
const M={
projects:{t:'المشاريع',f:[['name','اسم المشروع'],['client','العميل'],['value','قيمة العقد','n'],['start','تاريخ البدء','d'],['progress','نسبة الإنجاز %','n'],['status','الحالة','s',P]]},
contracts:{t:'العقود',f:[['no','رقم العقد'],['party','الطرف'],['kind','النوع','s',['عميل','مقاول باطن']],['proj','المشروع','p'],['value','القيمة','n'],['end','تاريخ الانتهاء','d']]},
purchases:{t:'المشتريات',img:true,f:[['item','الصنف'],['supplier','المورد'],['proj','المشروع','p'],['qty','الكمية','n'],['price','سعر الوحدة','n'],['status','الحالة','s',['طلب شراء','معتمد','تم التوريد']]],c:r=>r.qty*r.price},
inventory:{t:'المخازن',f:[['item','الصنف'],['store','المخزن'],['qty','الرصيد','n'],['cost','تكلفة الوحدة','n']],c:r=>r.qty*r.cost},
equipment:{t:'المعدات',f:[['name','المعدة'],['proj','المشروع','p'],['hours','ساعات التشغيل','n'],['rate','تكلفة الساعة','n'],['maint','الصيانة القادمة','d']],c:r=>r.hours*r.rate},
labor:{t:'العمالة',f:[['name','الاسم'],['role','المهنة'],['proj','المشروع','p'],['days','أيام الحضور','n'],['rate','اليومية','n']],c:r=>r.days*r.rate},
extracts:{t:'المستخلصات',f:[['no','رقم المستخلص'],['proj','المشروع','p'],['kind','النوع','s',['عميل','مقاول باطن']],['amount','القيمة','n'],['status','الحالة','s',['معد','معتمد','مدفوع']]]},
accounts:{t:'الحسابات',f:[['date','التاريخ','d'],['desc','البيان'],['type','النوع','s',['إيراد','مصروف']],['proj','مركز التكلفة','p'],['amount','المبلغ','n']]},
variations:{t:'أوامر التغيير',f:[['no','رقم الأمر'],['proj','المشروع','p'],['desc','البيان'],['value','القيمة (+/-)','n'],['status','الحالة','s',['مقترح','معتمد','مرفوض']]]},
transfers:{t:'تحويلات المخازن',f:[['date','التاريخ','d'],['item','الصنف'],['from','من مخزن'],['to','إلى مخزن'],['qty','الكمية','n']]},
invoices:{t:'الفواتير (ETA)',f:[['no','رقم الفاتورة'],['client','العميل'],['taxid','الرقم الضريبي'],['proj','المشروع','p'],['date','التاريخ','d'],['net','الصافي قبل الضريبة','n'],['status','الحالة','s',['مسودة','مرسلة للمصلحة','مقبولة']]],c:r=>n(r.net)*1.14},
users:{t:'المستخدمون',f:[['name','اسم المستخدم'],['pass','كلمة المرور','t'],['role','الصلاحية','s',['مدير','محاسب','مهندس موقع','مشتريات']]]}
};
let D={},cur='dash',U=null,E={},PF='',RID=0;
try{D=JSON.parse(localStorage.getItem('cms')||'{}')}catch(e){}
for(const k in M)D[k]=D[k]||[];
if(!D.users.length)D.users.push({id:1,name:'admin',pass:'1234',role:'مدير'});
const ROLES={'مدير':null,'محاسب':['dash','reports','variations','contracts','extracts','accounts','invoices','journal','purchases'],'مهندس موقع':['dash','variations','transfers','projects','labor','equipment','inventory','extracts'],'مشتريات':['dash','transfers','purchases','inventory','contracts']};
const allowed=k=>k=='report'||!U||!ROLES[U.role]||ROLES[U.role].includes(k);
const save=()=>{try{localStorage.setItem('cms',JSON.stringify(D))}catch(e){alert('تعذر الحفظ: المساحة ممتلئة. احذف بعض صور الفواتير أو خذ نسخة احتياطية.')}};
const n=x=>(+x||0);
const fmt=x=>n(x).toLocaleString('en-US',{maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pname=id=>(D.projects.find(p=>p.id==id)||{}).name||'—';

function stat(p){
 const id=p.id,by=(k,fn=()=>true)=>D[k].filter(r=>r.proj==id&&fn(r));
 const sum=(a,f)=>a.reduce((s,r)=>s+f(r),0);
 const income=sum(by('extracts',r=>r.kind=='عميل'&&r.status!='معد'),r=>n(r.amount))+sum(by('accounts',r=>r.type=='إيراد'),r=>n(r.amount));
 const cost=sum(by('purchases',r=>r.status!='طلب شراء'),M.purchases.c)+sum(by('labor'),M.labor.c)+sum(by('equipment'),M.equipment.c)+sum(by('extracts',r=>r.kind=='مقاول باطن'&&r.status!='معد'),r=>n(r.amount))+sum(by('accounts',r=>r.type=='مصروف'),r=>n(r.amount));
 return{income,cost,profit:income-cost};
}

function dash(){
 const ps=D.projects,st=ps.map(stat);
 const S=k=>st.reduce((s,x)=>s+x[k],0);
 const val=ps.reduce((s,p)=>s+n(p.value)+vo(p.id),0);
 const stock=D.inventory.reduce((s,r)=>s+M.inventory.c(r),0);
 const soon=D.equipment.filter(e=>e.maint&&(new Date(e.maint)-Date.now())/864e5<=14);
 const late=D.contracts.filter(c=>c.end&&(new Date(c.end)-Date.now())/864e5<=30);
 const kp=(l,v,c='')=>`<div class="k"><small>${l}</small><b class="${c}">${v}</b></div>`;
 let h=`<div class="hero"><h2 style="color:#fff;margin:0">${esc(D.co||'شركة المقاولات')}</h2></div><div class="grid">
 <div class="k big"><small>صافي الربح الفعلي</small><b class="${S('profit')>=0?'pos':'neg'}">${fmt(S('profit'))}</b></div>
 ${kp('عدد المشاريع',ps.length)}${kp('قيمة العقود',fmt(val))}${kp('الإيرادات المحصلة/المعتمدة',fmt(S('income')))}${kp('التكاليف الفعلية',fmt(S('cost')))}${kp('قيمة المخزون',fmt(stock))}</div>`;
 if(soon.length||late.length)h+=`<div class="panel"><b>تنبيهات</b><ul>${soon.map(e=>`<li>صيانة ${esc(e.name)} بتاريخ ${esc(e.maint)}</li>`).join('')}${late.map(c=>`<li>عقد ${esc(c.no)} ينتهي بتاريخ ${esc(c.end)}</li>`).join('')}</ul></div>`;
 h+=`<div class="panel"><b>موقف كل مشروع</b><div class="wrap"><table><tr><th>المشروع</th><th>الإنجاز</th><th>قيمة العقد</th><th>الإيراد</th><th>التكلفة</th><th>الربح</th></tr>`;
 h+=ps.length?ps.map((p,i)=>`<tr><td>${esc(p.name)}</td><td><div class="bar"><i style="width:${Math.min(100,n(p.progress))}%"></i></div>${n(p.progress)}%</td><td>${fmt(n(p.value)+vo(p.id))}</td><td>${fmt(st[i].income)}</td><td>${fmt(st[i].cost)}</td><td class="${st[i].profit>=0?'pos':'neg'}">${fmt(st[i].profit)}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">أضف مشروعك الأول من تبويب المشاريع</td></tr>`;
 return h+`</table></div></div>`;
}

function mod(k){
 const m=M[k],rows=D[k];
 const inp=([key,l,t,o])=>{
  let el;
  if(t=='s')el=`<select id="f_${key}">${o.map(x=>`<option>${x}</option>`).join('')}</select>`;
  else if(t=='p')el=`<select id="f_${key}"><option value="">—</option>${D.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>`;
  else el=`<input id="f_${key}" type="${t=='n'?'number':t=='d'?'date':key=='pass'?'password':'text'}">`;
  return`<div><label for="f_${key}">${l}</label>${el}</div>`;
 };
 let h=`<div class="hero"><h2 style="color:#fff;margin:0">${m.t}</h2></div><div class="panel formp"><div class="form">${m.f.map(inp).join('')}${m.img?'<div><label for="f_imgs">صور الفاتورة (واحدة أو أكثر)</label><input id="f_imgs" type="file" accept="image/*" multiple></div>':''}<button class="btn" onclick="add('${k}')">${E.k==k&&E.i!=null?'حفظ التعديل':'إضافة'}</button></div></div>`;
 h+=`<div class="panel"><div class="wrap"><table><tr>${m.f.map(f=>`<th>${f[1]}</th>`).join('')}${m.c?'<th>الإجمالي</th>':''}${m.img?'<th>الفواتير</th>':''}<th></th></tr>`;
 h+=rows.length?rows.map((r,i)=>!vis(k,r)?'':`<tr>${m.f.map(([key,,t])=>`<td>${key=='pass'?'••••':t=='p'?esc(pname(r[key])):t=='n'?fmt(r[key]):esc(r[key])}</td>`).join('')}${m.c?`<td>${fmt(m.c(r))}</td>`:''}${m.img?`<td>${imgCell(k,i)}</td>`:''}<td>${k=='projects'?`<button class="del" style="color:var(--steel)" onclick="prj(${r.id})">📊 تقرير</button> `:''}<button class="del" style="color:var(--steel)" onclick="edit('${k}',${i})">تعديل</button> <button class="del" onclick="del('${k}',${i})">حذف</button></td></tr>`).join(''):`<tr><td colspan="${m.f.length+2}" class="empty">لا توجد بيانات بعد</td></tr>`;
 h+=`</table></div>`;
 if(m.c)h+=`<div class="tot">الإجمالي: ${fmt(rows.filter(r=>vis(k,r)).reduce((s,r)=>s+m.c(r),0))}</div>`;
 if(k=='purchases')h+=`<div class="note">ضريبة القيمة المضافة 14% على الإجمالي: ${fmt(rows.filter(r=>vis(k,r)).reduce((s,r)=>s+m.c(r),0)*.14)}</div>`;
 if(k=='extracts')h+=`<div class="note">مستخلصات "معد" لا تدخل في حساب الإيراد أو التكلفة حتى يتم اعتمادها.</div>`;
 return h+`</div>`;
}

function add(k){
 const r={id:Date.now()};
 for(const [key,,t] of M[k].f){const v=document.getElementById('f_'+key).value;r[key]=t=='n'?n(v):v}
 if(!r[M[k].f[0][0]]&&r[M[k].f[0][0]]!==0){alert('املأ الحقل الأول أولاً');return}
 D[k].push(r);save();render();
}
function del(k,i){if(confirm('حذف هذا السجل؟')){E={};D[k].splice(i,1);save();render()}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function imp(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{try{D=JSON.parse(t);for(const k in M)D[k]=D[k]||[];save();render()}catch(e){alert('ملف غير صالح')}})};i.click()}
function go(k){cur=k;render()}
function render(){
 $nav.innerHTML=`<h1>نظام إدارة المقاولات</h1><button class="${cur=='dash'?'on':''}" onclick="go('dash')">لوحة التحكم</button>`+Object.keys(M).map(k=>`<button class="${cur==k?'on':''}" onclick="go('${k}')">${M[k].t}</button>`).join('')+`<div class="tools"><button onclick="window.print()">طباعة</button><button onclick="exp()">نسخة احتياطية</button><button onclick="imp()">استرجاع نسخة</button></div>`;
 $main.innerHTML=cur=='dash'?dash():mod(cur);
}

function jl(){
 const J=[],a=(date,desc,proj,dr,cr,v)=>v&&J.push({date:date||'',desc,proj,dr,cr,v});
 D.purchases.filter(r=>r.status=='تم التوريد').forEach(r=>{const v=M.purchases.c(r);a('','توريد '+r.item,r.proj,'تكاليف مواد المشروع','الموردون',v);a('','ضريبة مدخلات '+r.item,r.proj,'ضريبة قيمة مضافة مدخلات','الموردون',v*.14)});
 D.extracts.filter(r=>r.status!='معد').forEach(r=>{const v=n(r.amount);
  if(r.kind=='عميل'){a('','مستخلص عميل '+r.no,r.proj,'العملاء','إيرادات مستخلصات',v);if(r.status=='مدفوع')a('','تحصيل '+r.no,r.proj,'البنك والصندوق','العملاء',v)}
  else{a('','مستخلص باطن '+r.no,r.proj,'تكاليف مقاولي الباطن','مقاولو الباطن',v);if(r.status=='مدفوع')a('','سداد '+r.no,r.proj,'مقاولو الباطن','البنك والصندوق',v)}});
 D.invoices.filter(r=>r.status!='مسودة').forEach(r=>a(r.date,'ضريبة فاتورة '+r.no,r.proj,'العملاء','ضريبة قيمة مضافة مخرجات',n(r.net)*.14));
 D.labor.forEach(r=>a('','أجور '+r.name,r.proj,'تكاليف عمالة المشروع','البنك والصندوق',M.labor.c(r)));
 D.equipment.forEach(r=>a('','تشغيل '+r.name,r.proj,'تكاليف معدات المشروع','البنك والصندوق',M.equipment.c(r)));
 D.accounts.forEach(r=>r.type=='إيراد'?a(r.date,r.desc,r.proj,'البنك والصندوق','إيرادات أخرى',n(r.amount)):a(r.date,r.desc,r.proj,'مصروفات عامة','البنك والصندوق',n(r.amount)));
 return J;
}
function jr(){
 const J=jl().filter(j=>!PF||j.proj==PF),T={};J.forEach(j=>{(T[j.dr]=T[j.dr]||[0,0])[0]+=j.v;(T[j.cr]=T[j.cr]||[0,0])[1]+=j.v});
 const R=Object.entries(T),td=R.reduce((s,x)=>s+x[1][0],0),tc=R.reduce((s,x)=>s+x[1][1],0);
 return `<div class="hero"><h2 style="color:#fff;margin:0">القيود والميزان</h2></div><div class="note" style="margin:-8px 0 12px">تتولد القيود تلقائياً من المشتريات الموردة والمستخلصات المعتمدة والفواتير والعمالة والمعدات والحسابات.</div>
 <div class="panel"><b>ميزان المراجعة</b><div class="wrap"><table><tr><th>الحساب</th><th>مدين</th><th>دائن</th></tr>${R.map(([k,[d,c]])=>`<tr><td>${esc(k)}</td><td>${fmt(d)}</td><td>${fmt(c)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">لا قيود بعد</td></tr>'}<tr><th>الإجمالي</th><th>${fmt(td)}</th><th>${fmt(tc)}</th></tr></table></div></div>
 <div class="panel"><b>دفتر اليومية</b><div class="wrap"><table><tr><th>التاريخ</th><th>البيان</th><th>مركز التكلفة</th><th>مدين</th><th>دائن</th><th>المبلغ</th></tr>${J.map(j=>`<tr><td>${esc(j.date)}</td><td>${esc(j.desc)}</td><td>${esc(pname(j.proj))}</td><td>${esc(j.dr)}</td><td>${esc(j.cr)}</td><td>${fmt(j.v)}</td></tr>`).join('')}</table></div></div>`;
}
function add(k){
 const r={};
 for(const [key,,t] of M[k].f){const v=document.getElementById('f_'+key).value;r[key]=t=='n'?n(v):v}
 if(!r[M[k].f[0][0]]){alert('املأ الحقل الأول أولاً');return}
 if(k=='transfers'){if(E.k==k&&E.i!=null){alert('لا يمكن تعديل تحويل منفذ، احذفه وأنشئ غيره');E={};render();return}if(!r.qty||r.from==r.to||!mv(r.item,r.from,r.to,r.qty)){alert('تأكد من اسم الصنف والمخزن المصدر والرصيد الكافي');return}}
 if(E.k==k&&E.i!=null)Object.assign(D[k][E.i],r);else D[k].push({id:Date.now(),at:new Date().toISOString().slice(0,10),...r});
 E={};save();render();
}
function edit(k,i){E={k,i};render();scrollTo(0,0)}
function login(){U=D.users.find(u=>u.name==lu.value&&u.pass==lp.value)||null;if(!U)alert('بيانات الدخول غير صحيحة');render()}
function logout(){U=null;cur='dash';render()}
function render(){
 setBg();
 if(!U){$nav.innerHTML='';$main.innerHTML=`<div class="panel" style="max-width:340px;margin:60px auto"><h2>تسجيل الدخول</h2><label for="lu">المستخدم</label><input id="lu"><br><label for="lp">كلمة المرور</label><input id="lp" type="password" onkeydown="if(event.key=='Enter')login()"><br><br><button class="btn" onclick="login()">دخول</button><div class="note">أول دخول: admin / 1234. غيّرها من تبويب المستخدمين.</div></div>`;return}
 if(!allowed(cur))cur='dash';
 const ks=Object.keys(M).filter(k=>k!='users').concat('journal','users').filter(allowed);
 $nav.innerHTML=`<h1>نظام إدارة المقاولات<br><small>${esc(U.name)} - ${U.role}</small></h1><button class="${cur=='dash'?'on':''}" onclick="go('dash')">لوحة التحكم</button>`+ks.map(k=>`<button class="${cur==k?'on':''}" onclick="go('${k}')">${k=='journal'?'القيود والميزان':M[k].t}</button>`).join('')+`<div class="tools"><button onclick="window.print()">طباعة</button>${U.role=='مدير'?'<button onclick="bgUp()">تغيير خلفية هذا القسم</button><button onclick="bgReset()">الخلفية الافتراضية</button><button onclick="coName()">اسم الشركة</button>':''}${U.role=='مدير'?'<button onclick="exp()">نسخة احتياطية</button><button onclick="imp()">استرجاع نسخة</button>':''}<button onclick="logout()">تسجيل خروج</button></div>`;
 $main.innerHTML=cur=='dash'?dash():cur=='journal'?jr():mod(cur);
 if(E.k==cur&&E.i!=null)M[cur].f.forEach(([key])=>{document.getElementById('f_'+key).value=D[cur][E.i][key]??''});
}

function mv(item,from,to,q){
 const f=D.inventory.find(r=>r.item==item&&r.store==from);
 if(!f||n(f.qty)<q)return false;
 f.qty=n(f.qty)-q;
 const t=D.inventory.find(r=>r.item==item&&r.store==to);
 if(t)t.qty=n(t.qty)+q;else D.inventory.push({id:Date.now()+Math.random(),item,store:to,qty:q,cost:f.cost});
 return true;
}
function del(k,i){
 if(!confirm('حذف هذا السجل؟'))return;
 E={};
 if(k=='transfers'){const t=D.transfers[i];mv(t.item,t.to,t.from,n(t.qty))}
 D[k].splice(i,1);save();render();
}

const IC={dash:'🏠',projects:'🏗️',contracts:'📄',purchases:'🛒',inventory:'🏬',equipment:'🚜',labor:'👷',extracts:'🧾',accounts:'🧮',variations:'📝',transfers:'🔁',invoices:'💳',journal:'📚',reports:'📊',settings:'⚙️',users:'👥'};
const TT=k=>({dash:'الرئيسية',journal:'القيود والميزان',reports:'التقارير',settings:'الإعدادات'}[k]||M[k].t);
const SUB={projects:'إدارة المشاريع ومتابعة التنفيذ',contracts:'عقود العملاء والمقاولين',purchases:'طلب ومتابعة المشتريات',inventory:'إدارة المخزون',equipment:'متابعة المعدات والصيانة',labor:'الحضور والإنتاجية',extracts:'إعداد ومتابعة المستخلصات',accounts:'الإيرادات والمصروفات'};
function setBg(){const c=(D.bgs||{})[cur],b=document.body.style;b.setProperty('--bg',`url("${c||artUrl(cur)}")`);b.setProperty('--ph',`url("${c||(cur=='dash'?HERO:HERO2)}")`);b.setProperty('--pp',(Math.max(0,Object.keys(M).indexOf(cur))*23%100)+'% 50%');document.body.classList.toggle('lg',!U)}
function bgUp(k){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),r=Math.min(1,1280/im.width);c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);(D.bgs=D.bgs||{})[k]=c.toDataURL('image/jpeg',.7);save();render()};im.src=URL.createObjectURL(f)};i.click()}
function bgReset(k){if(D.bgs)delete D.bgs[k];save();render()}
function alerts(){
 const soon=D.equipment.filter(e=>e.maint&&(new Date(e.maint)-Date.now())/864e5<=14).length,late=D.contracts.filter(c=>c.end&&(new Date(c.end)-Date.now())/864e5<=30).length;
 return[['مستخلصات مستحقة الدفع',D.extracts.filter(r=>r.kind=='عميل'&&r.status=='معتمد').length,'#e5484d','extracts'],['أوامر شراء قيد الاعتماد',D.purchases.filter(r=>r.status=='طلب شراء').length,'#f59e0b','purchases'],['مواعيد صيانة قريبة',soon,'#f59e0b','equipment'],['مخزون منخفض',D.inventory.filter(r=>n(r.qty)<=10).length,'#e5484d','inventory'],['عقود تنتهي قريباً',late,'#1a73e8','contracts']];
}
function series(){
 const ms=[],t=new Date(),td=t.toISOString().slice(0,7);
 for(let i=5;i>=0;i--){const d=new Date(t.getFullYear(),t.getMonth()-i,1);ms.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
 const R=ms.map(()=>0),C=ms.map(()=>0),put=(a,r,v)=>{const i=ms.indexOf((r.date||r.at||td).slice(0,7));if(i>=0)a[i]+=v};
 D.extracts.filter(r=>r.status!='معد').forEach(r=>put(r.kind=='عميل'?R:C,r,n(r.amount)));
 D.accounts.forEach(r=>put(r.type=='إيراد'?R:C,r,n(r.amount)));
 D.purchases.filter(r=>r.status!='طلب شراء').forEach(r=>put(C,r,M.purchases.c(r)));
 D.labor.forEach(r=>put(C,r,M.labor.c(r)));D.equipment.forEach(r=>put(C,r,M.equipment.c(r)));
 return{ms,R,C};
}
function chart(){
 const{ms,R,C}=series(),mx=Math.max(1,...R,...C),W=520,H=190,x=i=>50+i*(W-70)/5,y=v=>H-20-(v/mx)*(H-40),pl=a=>a.map((v,i)=>x(i)+','+y(v)).join(' ');
 return `<svg viewBox="0 0 ${W} ${H+12}" style="width:100%">${[0,.5,1].map(f=>`<line x1="50" x2="${W-20}" y1="${y(mx*f)}" y2="${y(mx*f)}" stroke="#e3e8f0"/><text x="44" y="${y(mx*f)+4}" font-size="10" text-anchor="end" fill="#6b7378">${fmt(mx*f/1000)}k</text>`).join('')}<polyline points="${pl(R)}" fill="none" stroke="#1fa971" stroke-width="3"/><polyline points="${pl(C)}" fill="none" stroke="#1a73e8" stroke-width="3"/>${ms.map((m,i)=>`<text x="${x(i)}" y="${H+8}" font-size="10" text-anchor="middle" fill="#6b7378">${m.slice(5)}/${m.slice(2,4)}</text>`).join('')}</svg><div class="note"><span style="color:#1fa971">●</span> الإيرادات &nbsp; <span style="color:#1a73e8">●</span> التكاليف</div>`;
}
function dash(){
 const ps=D.projects.filter(p=>!PF||p.id==PF),st=ps.map(stat),S=k=>st.reduce((s,x)=>s+x[k],0),al=alerts();
 const val=ps.reduce((s,p)=>s+n(p.value)+vo(p.id),0),due=D.extracts.filter(r=>r.kind=='عميل'&&r.status=='معتمد').reduce((s,r)=>s+n(r.amount),0);
 const act=ps.filter(p=>p.status=='قيد التنفيذ').length,avg=ps.length?Math.round(ps.reduce((s,p)=>s+n(p.progress),0)/ps.length):0;
 const kp=([i,c,l,v,sub])=>`<div class="kp"><b class="ic" style="background:${c}22">${i}</b><div><small>${l}</small><strong>${v}</strong><em>${sub||'ج.م'}</em></div></div>`;
 const col=v=>v>=80?'#1fa971':v>=50?'#1a73e8':v>=30?'#f59e0b':'#e5484d';
 return `<div class="hero dh"></div><div class="kps">${[['🧾','#1fa971','المستخلصات المستحقة',fmt(due)],['📄','#1a73e8','قيمة العقود',fmt(val)],['📅','#7c3aed','المشاريع النشطة',act,'من إجمالي '+ps.length],['📈','#f59e0b','صافي الربح',fmt(S('profit'))],['💰','#1a73e8','إجمالي التكاليف',fmt(S('cost'))],['📊','#1fa971','إجمالي الإيرادات',fmt(S('income'))]].map(kp).join('')}</div>
 <div class="g4"><div class="pn"><h3>التنبيهات</h3>${al.map(a=>`<div class="al" onclick="go('${a[3]}')"><span style="background:${a[2]}">${a[1]}</span>${a[0]}</div>`).join('')}</div>
 <div class="pn"><h3>المشاريع الحالية</h3>${ps.length?ps.slice(0,5).map(p=>`<div class="pr"><b>${esc(p.name)}</b> <small style="color:#8794aa">${esc(p.client)}</small> <span style="float:left">${n(p.progress)}%</span><div class="b"><i style="width:${Math.min(100,n(p.progress))}%;background:${col(n(p.progress))}"></i></div></div>`).join(''):'<div class="empty">لا مشاريع بعد</div>'}</div>
 <div class="pn"><h3>نسب إنجاز المشاريع</h3><div class="donut" style="background:conic-gradient(#1a73e8 ${avg*3.6}deg,#e6ebf3 0)"><div>${avg}%</div></div><div class="note" style="text-align:center">متوسط الإنجاز</div></div>
 <div class="pn"><h3>تطور التكاليف والإيرادات</h3>${chart()}</div></div>
 <div class="tiles">${Object.keys(SUB).filter(allowed).map(k=>`<button class="tile" onclick="go('${k}')"><b>${IC[k]}</b><span>${M[k].t}</span><small>${SUB[k]}</small></button>`).join('')}</div>`;
}
const topbar=al=>`<div class="top"><div class="co">⛑️ ${esc(D.co||'شركة المقاولات')}</div>${pfSel()}<input class="sr" placeholder="ابحث في النظام ..." oninput="srch(this.value)"><button class="bell" onclick="go('dash')">🔔<i>${al.reduce((s,a)=>s+a[1],0)}</i></button><div class="dt">${new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}<br>${new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</div><div class="us">👤 ${esc(U.name)}<small>${U.role}</small></div></div>`;
function srch(v){v=v.trim();document.querySelectorAll('main .panel table tr').forEach(tr=>{if(tr.querySelector('td'))tr.style.display=!v||tr.textContent.includes(v)?'':'none'})}
function csv(k){const m=M[k],rows=[m.f.map(f=>f[1]).concat(m.c?['الإجمالي']:[])].concat(D[k].map(r=>m.f.map(([key,,t])=>t=='p'?pname(r[key]):(r[key]??'')).concat(m.c?[m.c(r)]:[])));const t='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');saveFile(k+'.csv',new Blob([t],{type:'text/csv'}))}
function reports(){return `<div class="hero"><h2 style="color:#fff;margin:0">التقارير</h2></div><div class="panel"><b>تقرير مشروع كامل بكل بنوده ومصاريفه</b>${D.projects.length?`<div class="form"><div><label for="rp">المشروع</label><select id="rp">${D.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><button class="btn" onclick="prj(document.getElementById('rp').value)">عرض التقرير</button></div>`:'<div class="empty">أضف مشروعاً أولاً</div>'}</div><div class="panel"><b>تصدير التقارير</b><div class="wrap"><table><tr><th>التقرير</th><th>Excel</th><th>PDF</th></tr>${Object.keys(M).filter(k=>k!='users').map(k=>`<tr><td>${IC[k]} ${M[k].t}</td><td><button class="btn" onclick="csv('${k}')">تصدير Excel</button></td><td><button class="btn" onclick="cur='${k}';render();setTimeout(print,200)">طباعة / PDF</button></td></tr>`).join('')}</table></div></div>`}
function settings(){const ks=['dash',...Object.keys(M).filter(k=>k!='users'),'journal','reports'];return `<div class="hero"><h2 style="color:#fff;margin:0">الإعدادات</h2></div><div class="panel"><b>بيانات الشركة</b><div class="form"><div><label for="cn">اسم الشركة</label><input id="cn" value="${esc(D.co||'')}"></div><button class="btn" onclick="D.co=document.getElementById('cn').value;save();render()">حفظ</button></div></div><div class="panel"><b>خلفيات الأقسام</b><div class="form"><div><label for="bs">القسم</label><select id="bs">${ks.map(k=>`<option value="${k}">${TT(k)}</option>`).join('')}</select></div><button class="btn" onclick="bgUp(document.getElementById('bs').value)">رفع صورة</button><button class="btn" onclick="bgReset(document.getElementById('bs').value)">الافتراضية</button></div></div><div class="panel"><b>النسخ الاحتياطي</b><div class="form"><button class="btn" onclick="exp()">نسخة احتياطية</button><button class="btn" onclick="imp()">استرجاع نسخة</button><button class="btn" onclick="logout()">تسجيل خروج</button></div></div>`}
function render(){
 setBg();
 if(!U){$nav.innerHTML='';$main.innerHTML=`<div class="panel" style="max-width:340px;margin:60px auto"><h2>تسجيل الدخول</h2><label for="lu">المستخدم</label><input id="lu"><br><label for="lp">كلمة المرور</label><input id="lp" type="password" onkeydown="if(event.key=='Enter')login()"><br><br><button class="btn" onclick="login()">دخول</button><div class="note">أول دخول: admin / 1234. غيّرها من تبويب المستخدمين.</div></div>`;return}
 if(!allowed(cur))cur='dash';
 const ks=['dash',...Object.keys(M).filter(k=>k!='users'),'journal','reports','users','settings'].filter(allowed);
 $nav.innerHTML=`<div class="brand"><span style="font-size:28px">⛑️</span><div>ERP مقاولات<br><small>إدارة أكثر .. نجاح أكبر</small></div></div>`+ks.map(k=>`<button class="${cur==k?'on':''}" onclick="go('${k}')">${IC[k]} ${TT(k)}</button>`).join('')+`<div class="tools"><small>اختصارات سريعة</small>${[['projects','+ إضافة مشروع'],['purchases','+ فاتورة مشتريات'],['labor','+ تسجيل حضور']].filter(x=>allowed(x[0])).map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join('')}<button onclick="window.print()">🖨️ طباعة</button><button onclick="logout()">⎋ تسجيل خروج</button></div>`;
 $main.innerHTML=topbar(alerts())+(cur=='dash'?dash():cur=='journal'?jr():cur=='report'?prjView():cur=='reports'?reports():cur=='settings'?settings():mod(cur));
 if(E.k==cur&&E.i!=null)M[cur].f.forEach(([key])=>{document.getElementById('f_'+key).value=D[cur][E.i][key]??''});
 else if(PF&&document.getElementById('f_proj'))document.getElementById('f_proj').value=PF;
}

const shrink=f=>new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),z=Math.min(1,1000/Math.max(im.width,im.height));c.width=im.width*z;c.height=im.height*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.65))};im.onerror=()=>res(null);im.src=URL.createObjectURL(f)});
function imgCell(k,i){const a=D[k][i].imgs||[];return a.length?`<button class="del" style="color:var(--steel)" onclick="viewImgs('${k}',${i})"><img class="th" src="${a[0]}">📎 ${a.length}</button>`:'—'}
function viewImgs(k,i){
 const r=D[k][i],ims=r.imgs||[];
 let v=document.getElementById('vw');if(!v){v=document.createElement('div');v.id='vw';document.body.appendChild(v)}
 v.innerHTML=`<div class="vb"><div class="vh"><b>صور الفاتورة - ${esc(r[M[k].f[0][0]])}</b><button class="btn" onclick="document.getElementById('vw').remove()">إغلاق ✕</button></div>${ims.map((s,j)=>`<div class="vi"><img src="${s}"><br><button class="del" onclick="delImg('${k}',${i},${j})">حذف هذه الصورة</button></div>`).join('')||'<div class="empty">لا توجد صور</div>'}</div>`;
}
function delImg(k,i,j){if(!confirm('حذف الصورة؟'))return;D[k][i].imgs.splice(j,1);save();render();viewImgs(k,i)}
async function add(k){
 const r={};
 for(const [key,,t] of M[k].f){const v=document.getElementById('f_'+key).value;r[key]=t=='n'?n(v):v}
 if(!r[M[k].f[0][0]]){alert('املأ الحقل الأول أولاً');return}
 let imgs=[];
 if(M[k].img){const fs=[...document.getElementById('f_imgs').files];imgs=(await Promise.all(fs.map(shrink))).filter(Boolean)}
 if(k=='transfers'){if(E.k==k&&E.i!=null){alert('لا يمكن تعديل تحويل منفذ، احذفه وأنشئ غيره');E={};render();return}if(!r.qty||r.from==r.to||!mv(r.item,r.from,r.to,r.qty)){alert('تأكد من اسم الصنف والمخزن المصدر والرصيد الكافي');return}}
 if(E.k==k&&E.i!=null){const row=D[k][E.i];Object.assign(row,r);if(imgs.length)row.imgs=(row.imgs||[]).concat(imgs)}
 else{const o={id:Date.now(),at:new Date().toISOString().slice(0,10),...r};if(imgs.length)o.imgs=imgs;D[k].push(o)}
 E={};save();render();
}

async function saveFile(name,blob){
 try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name=='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function exp(){saveFile('backup-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify(D)],{type:'application/json'}))}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}

const vis=(k,r)=>!PF||!M[k].f.some(f=>f[0]=='proj')||r.proj==PF;
const pfSel=()=>`<select class="pf" title="تصفية حسب المشروع" onchange="PF=this.value;render()"><option value="">كل المشاريع</option>${D.projects.map(p=>`<option value="${p.id}"${p.id==PF?' selected':''}>${esc(p.name)}</option>`).join('')}</select>`;
const PK=['contracts','variations','purchases','labor','equipment','extracts','invoices','accounts'];
function prj(id){RID=id;cur='report';render();scrollTo(0,0)}
function prjData(id){
 const p=D.projects.find(x=>x.id==id);if(!p)return null;
 const by=k=>D[k].filter(r=>r.proj==id),sum=(k,fn)=>by(k).reduce((t,r)=>t+fn(r),0),s=stat(p),cv=n(p.value)+vo(p.id);
 const cost=[['مواد ومشتريات',sum('purchases',r=>r.status!='طلب شراء'?M.purchases.c(r):0)],['عمالة',sum('labor',M.labor.c)],['معدات',sum('equipment',M.equipment.c)],['مقاولو الباطن',sum('extracts',r=>r.kind=='مقاول باطن'&&r.status!='معد'?n(r.amount):0)],['مصروفات أخرى',sum('accounts',r=>r.type=='مصروف'?n(r.amount):0)]];
 return{p,by,s,cv,cost};
}
function prjView(){
 const d=prjData(RID);if(!d)return '<div class="empty">المشروع غير موجود</div>';
 const{p,by,s,cv,cost}=d,mg=s.income?Math.round(s.profit/s.income*100):0;
 const kp=([i,c,l,v,x])=>`<div class="kp"><b class="ic" style="background:${c}22">${i}</b><div><small>${l}</small><strong>${v}</strong><em>${x||'ج.م'}</em></div></div>`;
 const tb=k=>{const m=M[k],rs=by(k),cols=m.f.filter(f=>f[0]!='proj');
  return rs.length?`<div class="panel"><b>${IC[k]} ${m.t}</b><div class="wrap"><table><tr>${cols.map(f=>`<th>${f[1]}</th>`).join('')}${m.c?'<th>الإجمالي</th>':''}${m.img?'<th>الفواتير</th>':''}</tr>${rs.map(r=>`<tr>${cols.map(([key,,t])=>`<td>${t=='n'?fmt(r[key]):esc(r[key])}</td>`).join('')}${m.c?`<td>${fmt(m.c(r))}</td>`:''}${m.img?`<td>${(r.imgs||[]).length?`<button class="del" style="color:var(--steel)" onclick="viewImgs('${k}',${D[k].indexOf(r)})">📎 ${r.imgs.length}</button>`:'—'}</td>`:''}</tr>`).join('')}</table></div>${m.c?`<div class="tot">الإجمالي: ${fmt(rs.reduce((t,r)=>t+m.c(r),0))}</div>`:''}</div>`:''};
 const tc=cost.reduce((t,c)=>t+c[1],0);
 return `<div class="hero"><h2 style="color:#fff;margin:0">تقرير مشروع: ${esc(p.name)}</h2></div><div class="pt">تقرير مشروع: ${esc(p.name)} - ${esc(D.co||'')}</div>
 <div class="panel"><div class="form"><div><b>${esc(p.name)}</b><br><small>العميل: ${esc(p.client)} | البدء: ${esc(p.start)} | الحالة: ${esc(p.status)} | الإنجاز: ${n(p.progress)}%</small></div><button class="btn" onclick="print()">طباعة / PDF</button><button class="btn" onclick="prjCsv(${p.id})">تصدير Excel</button><button class="btn" onclick="go('reports')">رجوع</button></div></div>
 <div class="kps">${[['📄','#1a73e8','قيمة العقد',fmt(n(p.value))],['📝','#7c3aed','أوامر تغيير معتمدة',fmt(vo(p.id))],['📑','#1a73e8','إجمالي العقد',fmt(cv)],['📊','#1fa971','الإيرادات',fmt(s.income)],['💰','#e5484d','التكاليف',fmt(s.cost)],['📈','#f59e0b','صافي الربح',fmt(s.profit),'هامش '+mg+'%'],['⏳','#1a73e8','المتبقي من العقد',fmt(cv-s.income)]].map(kp).join('')}</div>
 <div class="panel"><b>توزيع التكاليف</b><div class="wrap"><table><tr><th>البند</th><th>المبلغ</th><th>النسبة</th></tr>${cost.map(c=>`<tr><td>${c[0]}</td><td>${fmt(c[1])}</td><td>${tc?Math.round(c[1]/tc*100):0}%</td></tr>`).join('')}<tr><th>الإجمالي</th><th>${fmt(tc)}</th><th></th></tr></table></div><div class="note">لا تدخل في التكاليف الأصناف بحالة "طلب شراء" ولا المستخلصات بحالة "معد".</div></div>`+PK.map(tb).join('');
}
function prjCsv(id){
 const d=prjData(id);if(!d)return;const{p,by,s,cv,cost}=d;
 const R=[['تقرير مشروع',p.name],['العميل',p.client],['قيمة العقد',n(p.value)],['أوامر تغيير معتمدة',vo(p.id)],['إجمالي العقد',cv],['الإيرادات',s.income],['التكاليف',s.cost],['صافي الربح',s.profit],[],['توزيع التكاليف']].concat(cost);
 PK.forEach(k=>{const m=M[k],rs=by(k);if(!rs.length)return;const cols=m.f.filter(f=>f[0]!='proj');R.push([],[m.t],cols.map(f=>f[1]).concat(m.c?['الإجمالي']:[]));rs.forEach(r=>R.push(cols.map(([key])=>r[key]??'').concat(m.c?[m.c(r)]:[])))});
 saveFile(p.name+'.csv',new Blob(['\ufeff'+R.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));
}
const $nav=document.getElementById('nav'),$main=document.getElementById('main');
render();
</script>
</body>
</html>
